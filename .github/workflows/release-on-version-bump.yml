name: Release on Version Bump

on:
  push:
    branches:
      - auto-release
    paths:
      - 'src/piperf3/__init__.py'

jobs:
  check-version-and-release:
    name: Check Version and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to compare with previous commit

      - name: Get current version from __init__.py
        id: current
        run: |
          VERSION=$(grep '__version__ = ' src/piperf3/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Get previous version from git
        id: previous
        run: |
          # Get the version from the previous commit
          PREVIOUS_VERSION=$(git show HEAD~1:src/piperf3/__init__.py 2>/dev/null | grep '__version__ = ' | sed 's/__version__ = "\(.*\)"/\1/' || echo "")
          echo "version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          PREVIOUS="${{ steps.previous.outputs.version }}"
          
          echo "Current version: $CURRENT"
          echo "Previous version: $PREVIOUS"
          
          if [ "$CURRENT" != "$PREVIOUS" ] && [ ! -z "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS to $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          fi

      - name: Create git tag
        if: steps.version_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.current.outputs.tag }}
          git push origin ${{ steps.current.outputs.tag }}

      - name: Create GitHub Release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.current.outputs.tag }}
          generate_release_notes: true
